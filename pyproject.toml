[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentshield"
version = "0.1.1"
description = "AI Red Teaming + Agent Security Evaluation + Runtime Observability for LLM apps, agents, RAG and tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TroubieD3v" }]
maintainers = [{ name = "TroubieD3v" }]
dependencies = [
  "pydantic>=2.8",
  "pyyaml>=6",
  "jsonschema>=4.20",
  "httpx>=0.27",
  "typer>=0.12",
  "jinja2>=3.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "redis>=5",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
otel = ["opentelemetry-api>=1.24", "opentelemetry-sdk>=1.24"]
dev = ["pytest>=8", "pytest-cov", "ruff", "playwright>=1.44"]

[project.scripts]
agentshield = "agentshield.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentshield"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: browser end-to-end tests (need `playwright install chromium`)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
