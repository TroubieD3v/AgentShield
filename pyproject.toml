[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentshield"
version = "0.1.1"
description = "AI Red Teaming + Agent Security Evaluation + Runtime Observability for LLM apps, agents, RAG and tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TroubieD3v" }]
maintainers = [{ name = "TroubieD3v" }]
dependencies = [
  "pydantic>=2.14.3",
  "pyyaml>=6.0.3",
  "jsonschema>=4.26.0",
  "httpx>=0.28.1",
  "typer>=0.29.2",
  "jinja2>=3.1.6",
  "fastapi>=0.164.0",
  "uvicorn[standard]>=0.54.0",
  "sqlalchemy>=2.1.9",
  "redis>=8.1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3.9"]
otel = ["opentelemetry-api>=1.45.2", "opentelemetry-sdk>=1.45.2"]
dev = ["pytest>=9.2.0", "pytest-cov", "ruff", "playwright>=1.65.2"]

[project.scripts]
agentshield = "agentshield.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentshield"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: browser end-to-end tests (need `playwright install chromium`)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
